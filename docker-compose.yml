version: '3.8'

services:
  # ── API Pulse Unified Production Container (Frontend + Backend) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_pulse_app
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=production
      - PORT=8000
      - JWT_SECRET=api_pulse_production_secret_key_change_me
      # Optional: To connect to PostgreSQL, uncomment the line below:
      # - DATABASE_URL=postgresql://postgres:password@postgres:5432/apipulse
      # Optional: Add your Google Gemini API Key here for AI Root Cause Analysis:
      # - GEMINI_API_KEY=your_gemini_api_key
    volumes:
      # Persist SQLite database and runtime telemetry across container restarts
      - api_pulse_data:/app/backend/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: PostgreSQL Database (Uncomment if needed) ──
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: api_pulse_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: apipulse
  #   ports:
  #     - '5432:5432'
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U postgres -d apipulse']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  api_pulse_data:
